<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-label="Illustration of a couple leaning their heads together">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C9B8"/>
      <stop offset=".55" stop-color="#E7B7D6"/>
      <stop offset="1" stop-color="#B995F5"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF3DE"/>
      <stop offset="1" stop-color="#FFF3DE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="720" fill="url(#sky)"/>
  <circle cx="300" cy="250" r="260" fill="url(#sun)"/>
  <circle cx="300" cy="250" r="120" fill="#FFF3DE" opacity=".55"/>
  <!-- soft hills -->
  <path d="M0 520 C120 450 240 470 330 500 C430 535 520 480 600 440 L600 720 L0 720Z" fill="url(#hillA)" opacity=".55"/>
  <path d="M0 585 C140 530 260 560 360 590 C450 615 530 580 600 555 L600 720 L0 720Z" fill="#4C1D95" opacity=".75"/>
  <!-- tiny stars/hearts -->
  <g fill="#fff" opacity=".7">
    <circle cx="90" cy="120" r="3"/><circle cx="520" cy="90" r="2.5"/><circle cx="470" cy="190" r="2"/><circle cx="130" cy="220" r="2"/>
  </g>

  <!-- Person B (behind, right): long hair -->
  <g>
    <path d="M300 640 C300 560 345 520 410 516 L500 516 C560 520 590 575 592 640Z" fill="#17131F"/>
    <path d="M338 640 C340 575 372 548 420 546 L492 546 C540 552 560 590 562 640Z" fill="#E8DCCB"/>
    <!-- hair back -->
    <path d="M338 255 C330 150 400 112 450 120 C510 128 548 180 540 270 C536 330 548 375 520 420 C470 440 420 430 392 410 C372 380 344 330 338 255Z" fill="#3B1F12"/>
    <rect x="428" y="395" width="44" height="64" rx="18" fill="#C98E68"/>
    <ellipse cx="448" cy="320" rx="68" ry="82" fill="#D79F78" transform="rotate(-8 448 320)"/>
    <!-- fringe -->
    <path d="M382 270 C392 205 450 190 496 222 C478 214 440 224 420 262 C410 250 398 254 382 270Z" fill="#3B1F12"/>
    <!-- face -->
    <path d="M420 330 q8 6 16 0" stroke="#7a3f2a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M462 328 q8 6 16 0" stroke="#7a3f2a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M428 370 q22 20 46 0" stroke="#7a3f2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="414" cy="352" r="9" fill="#F0907F" opacity=".45"/><circle cx="484" cy="348" r="9" fill="#F0907F" opacity=".45"/>
  </g>

  <!-- Person A (front, left): short hair, sweater -->
  <g>
    <path d="M30 650 C30 565 90 520 170 514 L280 514 C350 520 392 575 392 650Z" fill="#6D28D9"/>
    <path d="M70 650 C72 592 112 556 176 550 L262 550 C318 556 352 596 352 650Z" fill="#8B5CF6"/>
    <rect x="190" y="400" width="52" height="70" rx="20" fill="#E3B48F"/>
    <ellipse cx="216" cy="318" rx="72" ry="86" fill="#EDC19D" transform="rotate(9 216 318)"/>
    <!-- hair -->
    <path d="M144 300 C130 210 190 160 252 170 C306 178 336 224 322 290 C312 262 290 238 258 232 C226 226 180 236 160 280 C156 288 150 298 144 300Z" fill="#17131F"/>
    <path d="M150 292 C142 250 160 218 190 204" stroke="#2B2336" stroke-width="6" fill="none" stroke-linecap="round" opacity=".6"/>
    <!-- face -->
    <path d="M190 330 q8 6 16 0" stroke="#7a3f2a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M236 334 q8 6 16 0" stroke="#7a3f2a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M196 376 q26 22 52 -2" stroke="#7a3f2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="180" cy="356" r="9" fill="#F0907F" opacity=".45"/><circle cx="262" cy="360" r="9" fill="#F0907F" opacity=".45"/>
  </g>

  <!-- floating hearts -->
  <g fill="#fff">
    <path transform="translate(300 120) scale(1.3)" d="M0 8 C-14 -4 -6 -16 0 -8 C6 -16 14 -4 0 8Z" opacity=".95"/>
    <path transform="translate(350 70) scale(.8)" d="M0 8 C-14 -4 -6 -16 0 -8 C6 -16 14 -4 0 8Z" opacity=".7"/>
    <path transform="translate(255 70) scale(.6)" d="M0 8 C-14 -4 -6 -16 0 -8 C6 -16 14 -4 0 8Z" opacity=".6"/>
  </g>
</svg>
